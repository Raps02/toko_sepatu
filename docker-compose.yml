services:
  postgres:
    image: postgres:16-alpine
    container_name: toko_sepatu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: app_db
    ports:
      # Hanya bisa diakses dari komputer ini, bukan dari jaringan.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
